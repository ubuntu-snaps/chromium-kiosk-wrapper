name: chromium-kiosk-wrapper
version: git
summary: Chromium Kiosk Wrapper for Ubuntu Core
description: |
  A snap that runs Chromium in kiosk mode, suitable for digital signage
  and dedicated display applications on Ubuntu Core.

base: core24
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  chromium-kiosk:
    command: bin/chromium-kiosk-launcher
    daemon: simple
    restart-condition: always
    environment:
      WAYLAND_DISPLAY: "wayland-0"
      XDG_RUNTIME_DIR: "$SNAP_DATA/wayland"
    plugs:
      - network
      - network-bind
      - wayland
      - opengl
      - audio-playback
      - audio-record
      - camera
      - removable-media
      - home
      - browser-support
      - system-files
      - content[chromium-browser]

parts:
  chromium-kiosk-launcher:
    plugin: dump
    source: scripts
    organize:
      chromium-kiosk-launcher: bin/chromium-kiosk-launcher
    stage:
      - bin/chromium-kiosk-launcher

slots:
  kiosk-session:
    interface: wayland
    wayland:
      socket-dir: $SNAP_DATA/wayland

plugs:
  chromium-browser:
    interface: content
    target: $SNAP/chromium
    default-provider: chromium-browser
