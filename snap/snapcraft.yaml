name: chromium-kiosk-wrapper
version: git
summary: Chromium Kiosk Wrapper for Ubuntu Core
description: |
  A snap that runs Chromium in kiosk mode, suitable for digital signage
  and dedicated display applications on Ubuntu Core.

base: core24
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  daemon:
    command: bin/chromium-kiosk-launcher
    daemon: simple
    restart-condition: always
    environment:
      WAYLAND_DISPLAY: "wayland-0"
      XDG_RUNTIME_DIR: "$SNAP_DATA/wayland"
    plugs:
      - network
      - network-bind
      - wayland
      - opengl
      - audio-playback
      - audio-record
      - camera
      - removable-media
      - home
      - browser-support
      - system-files
      - content[chromium]

parts:
  chromium-kiosk-launcher:
    plugin: dump
    source: scripts
    organize:
      chromium-kiosk-launcher: bin/chromium-kiosk-launcher
      download-extensions.sh: bin/download-extensions.sh
    stage:
      - bin/chromium-kiosk-launcher
      - bin/download-extensions.sh

  extensions:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    override-build: |
      craftctl default
      # Pre-configured extension IDs
      EXTENSION_IDS="geanehlidigfgabljleifobmmlfiepke"
      "$CRAFT_PART_SRC/../scripts/download-extensions.sh" "$CRAFT_PART_INSTALL/extensions" "$EXTENSION_IDS"
    organize:
      extensions: extensions
    stage:
      - extensions
    prime:
      - extensions

slots:
  kiosk-session:
    interface: wayland
    wayland:
      socket-dir: $SNAP_DATA/wayland

plugs:
  chromium:
    interface: content
    target: $SNAP/chromium
    default-provider: chromium
