name: chromium-kiosk-wrapper
version: git
summary: Chromium Kiosk Wrapper for Ubuntu Core
description: |
  A snap that runs Chromium in kiosk mode, suitable for digital signage
  and dedicated display applications on Ubuntu Core.

base: core24
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  daemon:
    command: bin/chromium-kiosk-launcher
    daemon: simple
    restart-condition: always
    environment:
      WAYLAND_DISPLAY: "wayland-0"
      XDG_RUNTIME_DIR: "$SNAP_DATA/wayland"
    plugs:
      - network
      - network-bind
      - wayland
      - opengl
      - audio-playback
      - audio-record
      - camera
      - browser-support

parts:
  chromium-kiosk-launcher:
    plugin: dump
    source: scripts
    organize:
      chromium-kiosk-launcher: bin/chromium-kiosk-launcher
      download-extensions.sh: bin/download-extensions.sh
    stage:
      - bin/chromium-kiosk-launcher
      - bin/download-extensions.sh

  chromium:
    plugin: nil
    stage-snaps:
      - chromium
    override-build: |
      craftctl default
      # Fix external symlink: usr/bin/xdg-email -> /usr/bin/xdg-open
      if [ -L "${CRAFT_PART_INSTALL}/usr/bin/xdg-email" ]; then
          rm -f "${CRAFT_PART_INSTALL}/usr/bin/xdg-email"
      fi
      # Fix chrome-sandbox permissions (should be 4755 for setuid)
      SANDBOX="${CRAFT_PART_INSTALL}/usr/lib/chromium-browser/chrome-sandbox"
      if [ -f "${SANDBOX}" ]; then
          chmod 4755 "${SANDBOX}"
      fi

  extensions:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    source: scripts
    override-build: |
      craftctl default
      # Pre-configured extension IDs
      EXTENSION_IDS="geanehlidigfgabljleifobmmlfiepke"
      "$CRAFT_PART_SRC/download-extensions.sh" "$CRAFT_PART_INSTALL/extensions" "$EXTENSION_IDS"
    organize:
      extensions: extensions
    stage:
      - extensions
    prime:
      - extensions
